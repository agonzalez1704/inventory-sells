<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Refaccionaria Ruli">
  <!-- Literal colours, not hsl(var(--brand)): a favicon is fetched on its own,
       outside the page, so the app's CSS custom properties don't reach it. -->
  <rect width="64" height="64" rx="14" fill="#D61F28"/>
  <text x="32" y="45" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="40" font-weight="800" fill="#FFFFFF">R</text>
</svg>
